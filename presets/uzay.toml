# Uzay reçetesi: toplu üretim (batch.py) için ayarlar.
# Kullanım: uv run python batch.py konular.csv --preset presets/uzay.toml
#
# [video] anahtarları `uv run python cli.py --help` bayraklarının alt çizgili adıdır
# (--video-source-fallback -> video_source_fallback). Burada olmayan ayarlar config.toml'dan
# gelir. Bilinmeyen anahtar ya da geçersiz değer üretim başlamadan hata verir.

[video]
llm_provider = "claude_code"
# llm_model = ""                       # boşsa sağlayıcının config.toml'daki modeli
video_language = "tr-TR"
script_accuracy_rules = true
video_source = "nasa"
# Yedek zinciri: NASA yetmeyen terim önce Pixabay'de, o da yetmezse Coverr'da aranır. Coverr anahtarı
# (coverr_api_keys) yoksa Coverr görev başına bir uyarıyla atlanır; iş etkilenmez.
video_source_fallback = ["pixabay", "coverr"]
video_aspect = "9:16"
crop_materials_to_aspect = true
material_tag_relevance = "rank"
match_materials_to_script = true
video_terms_style = "visual"
exclude_ai_generated_materials = false
nasa_credit_overlay = true
nasa_text_filter = true
voice_name = "tr-TR-EmelNeural-Female"
voice_rate = 1.0
font_name = "STHeitiMedium.ttc"
stroke_width = 3
video_clip_duration = 5
final_render_engine = "ffmpeg"
# Altyazı görünümü de burada sabit: config.toml'daki WebUI değerleri değişse de (05.11'de eski bir WebUI
# süreci altyazıyı kapatmış, sesi 0,8'e çekmişti) toplu iş aynı videoyu üretir; .srt için altyazı açık olmalı.
subtitle_enabled = true
subtitle_position = "bottom"
font_size = 60
text_fore_color = "#FFFFFF"
stroke_color = "#000000"

# Yalnız bu süreçte geçerli config.app ayarları; config.toml'a yazılmaz.
[app]
material_concurrency = 3
video_clip_concurrency = 3
nasa_face_filter = true
video_source_fallback_min_relevance = 0.5
video_source_fallback_min_candidates = 1

# Metin talimatı. Yer tutucular: {kelime_min}, {kelime_max} (target_words'ten), {konu}.
# Girdideki "talimat" sütunu bu metnin sonuna eklenir.
[script]
target_words = [90, 100]
prompt = """
En az {kelime_min}, en çok {kelime_max} kelime yaz; {kelime_min} kelimenin altına inme. Merak \
uyandıran bir soru veya şaşırtıcı bir gerçekle başla. Konuyu tek bir somut, gerçek örnekle anlat: adı \
bilinen bir gök cismi, bir gözlem ya da bir ölçüm. Yalnız konunun adı bilimsel bir terim değil de bir \
takma adsa (ör. "zombi yıldız"), takma ad olduğunu söyle ve gerçekte neyi kastettiğini açıkla; başka \
hiçbir şeye takma ad deme. Akıcı, sade ve heyecanlı bir dil kullan.
"""

# Kalite kontrolü: süre hedefi (saniye) ve bağımsız doğruluk denetimi.
# review_before_render: iki aşamalı akış. Önce bütün konuların metni ve terimleri üretilip denetlenir;
# metinler arayüzde (ya da batch.py onay komutlarıyla) düzeltilip onaylanır; yalnız onaylananlar
# "batch.py render <klasör>" ile videoya dönüşür. WebUI'da yalnız o toplu iş için değiştirilebilir.
[quality]
target_duration = [35, 60]
audit = true
review_before_render = true

# Yükleme paketi: altyazi.tr.srt her zaman; burada listelenen diller için çeviri (altyazi.<dil>.srt).
# BCP-47 kodları, ör. ["en", "de"]; WebUI'da yalnız o toplu iş için değiştirilebilir.
[package]
subtitle_translations = ["en"]
